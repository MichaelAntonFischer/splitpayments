on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  static_release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Configure Git user name and email
      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      # Set a static tag name
      - name: Set static tag and release name
        id: set_static_name
        run: |
          echo "tag=static-release" >> $GITHUB_OUTPUT
          echo "release_name=Static Release" >> $GITHUB_OUTPUT

      # Check if tag exists and delete it if it does
      - name: Delete existing tag
        run: |
          if git rev-parse ${{ steps.set_static_name.outputs.tag }} >/dev/null 2>&1; then
            git tag -d ${{ steps.set_static_name.outputs.tag }}
            git push --delete origin ${{ steps.set_static_name.outputs.tag }}
          fi

      # Create or move the tag to the current commit
      - name: Create or move tag
        run: |
          git tag -fa ${{ steps.set_static_name.outputs.tag }} -m "${{ steps.set_static_name.outputs.release_name }}"
          git push origin ${{ steps.set_static_name.outputs.tag }} --force

      # Check and create or update the release
      - name: Check and create or update the release
        run: |
          RELEASE_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/static-release | jq .id)

          if [[ "$RELEASE_ID" != "null" ]]; then
            echo "Updating existing release..."
            curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID \
              -d '{"tag_name": "static-release", "name": "Static Release", "body": "Several Changes in this Release", "draft": false, "prerelease": false}'
          else
            echo "Creating new release..."
            curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              https://api.github.com/repos/${{ github.repository }}/releases \
              -d '{"tag_name": "static-release", "name": "Static Release", "body": "Several Changes in this Release", "draft": false, "prerelease": false}'
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  version_release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if echo "$VERSION" | grep -q 'rc'; then
            echo "is_rc=true" >> $GITHUB_OUTPUT
          else
            echo "is_rc=false" >> $GITHUB_OUTPUT
          fi
          CLEAN_VERSION=$(echo "$VERSION" | sed 's/-rc[0-9]*$//')
          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "Processing version: $VERSION"
          echo "Is RC: $(echo "$VERSION" | grep -q 'rc' && echo 'true' || echo 'false')"
          echo "Clean version: $CLEAN_VERSION"

      - name: Create version release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Split Payments ${{ steps.get_version.outputs.version }}
          body: |
            Release ${{ steps.get_version.outputs.version }} of Split Payments extension for LNbits.
            
            Have payments split between multiple wallets automatically.
          draft: false
          prerelease: ${{ steps.get_version.outputs.is_rc }}

      - name: Wait for release to be available
        run: |
          echo "Waiting for GitHub to make the release archive available..."
          sleep 30

      - name: Calculate SHA256 hash
        id: calculate_hash
        run: |
          # Download the release archive
          ARCHIVE_URL="https://github.com/${{ github.repository }}/archive/refs/tags/${{ steps.get_version.outputs.version }}.zip"
          echo "Downloading archive from: $ARCHIVE_URL"
          
          # Retry logic for downloading
          for i in {1..5}; do
            if wget -O release.zip "$ARCHIVE_URL"; then
              break
            else
              echo "Download attempt $i failed, retrying in 10 seconds..."
              sleep 10
            fi
          done
          
          if [ ! -f release.zip ]; then
            echo "Failed to download release archive after 5 attempts"
            exit 1
          fi
          
          # Calculate SHA256 hash
          HASH=$(sha256sum release.zip | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "Archive URL: $ARCHIVE_URL"
          echo "SHA256 Hash: $HASH"

      - name: Update extensions.json
        run: |
          # Clone the extensions repository
          echo "Cloning extensions repository..."
          git clone https://github.com/MichaelAntonFischer/lnbits-extensions.git extensions-repo
          cd extensions-repo
          
          # Configure git
          git config user.name "Cursor-MCP-MAF"
          git config user.email "actions@github.com"
          
          # Prepare variables
          VERSION="${{ steps.get_version.outputs.version }}"
          IS_RC="${{ steps.get_version.outputs.is_rc }}"
          CLEAN_VERSION="${{ steps.get_version.outputs.clean_version }}"
          HASH="${{ steps.calculate_hash.outputs.hash }}"
          ARCHIVE_URL="https://github.com/${{ github.repository }}/archive/refs/tags/$VERSION.zip"
          
          echo "Updating extensions.json with:"
          echo "- Version: $VERSION"
          echo "- Is RC: $IS_RC"
          echo "- Clean Version: $CLEAN_VERSION"
          echo "- Hash: $HASH"
          
          # Update extensions.json using Python
          python3 << 'EOF'
          import json
          import sys
          import os
          
          # Read current extensions.json
          try:
              with open('extensions.json', 'r') as f:
                  raw_data = json.load(f)
              
              print(f"Raw JSON type: {type(raw_data)}")
              print(f"Raw JSON content: {raw_data}")
              
              # Handle different JSON structures
              if isinstance(raw_data, list):
                  data = raw_data
              elif isinstance(raw_data, dict) and 'extensions' in raw_data:
                  data = raw_data['extensions']
              else:
                  print("Unknown JSON structure, creating new list")
                  data = []
              
              print(f"Loaded {len(data)} existing extensions")
              
              # Debug: show types of first few items
              for i, item in enumerate(data[:3]):
                  print(f"Item {i} type: {type(item)}, content: {item}")
              
          except Exception as e:
              print(f"Error reading extensions.json: {e}")
              sys.exit(1)
          
          # Get environment variables
          version = os.environ.get('VERSION', '')
          is_rc = os.environ.get('IS_RC', 'false') == 'true'
          clean_version = os.environ.get('CLEAN_VERSION', '')
          hash_value = os.environ.get('HASH', '')
          archive_url = os.environ.get('ARCHIVE_URL', '')
          
          print(f"Processing version: {version}, is_rc: {is_rc}")
          
          # Create the new entry
          new_entry = {
            "id": "splitpayments",
            "repo": "https://github.com/${{ github.repository }}",
            "name": "Split Payments",
            "version": version,
            "short_description": "Have payments split between multiple wallets automatically",
            "icon": "https://raw.githubusercontent.com/${{ github.repository }}/main/static/image/split-payments.png",
            "archive": archive_url,
            "hash": hash_value
          }
          
          # Ensure data is a list and contains only dictionaries
          if not isinstance(data, list):
              print(f"Error: data is not a list, it's {type(data)}")
              sys.exit(1)
          
          # Filter with safety checks
          original_count = len(data)
          safe_data = []
          for ext in data:
              if isinstance(ext, dict):
                  if ext.get('id') != 'splitpayments':
                      safe_data.append(ext)
              else:
                  print(f"Warning: skipping non-dict item: {ext}")
          
          data = safe_data
          removed_count = original_count - len(data)
          print(f"Removed {removed_count} existing splitpayments entries")
          
          if is_rc:
              # For RC versions, remove other RC versions of the same clean version
              # Since we already removed all splitpayments entries, we need to check all extensions again
              before_rc_cleanup = len(data)
              safe_data = []
              for ext in data:
                  if isinstance(ext, dict):
                      # Keep all non-splitpayments entries
                      if ext.get('id') != 'splitpayments':
                          safe_data.append(ext)
                      # For splitpayments entries, only keep if not an RC of the same clean version
                      elif not ext.get('version', '').startswith(clean_version + '-rc'):
                          safe_data.append(ext)
                  else:
                      print(f"Warning: skipping non-dict item during RC cleanup: {ext}")
              
              data = safe_data
              rc_removed = before_rc_cleanup - len(data)
              print(f"Removed {rc_removed} other RC versions for {clean_version}")
          
          # Add the new entry
          data.append(new_entry)
          
          # Sort by extension id for consistency
          data.sort(key=lambda x: x.get('id', '') if isinstance(x, dict) else '')
          
          # Write back to extensions.json
          try:
              with open('extensions.json', 'w') as f:
                  json.dump(data, f, indent=2)
              print(f"Successfully updated extensions.json with version {version}")
              print(f"Total extensions: {len(data)}")
          except Exception as e:
              print(f"Error writing extensions.json: {e}")
              sys.exit(1)
          EOF
          
          # Check if there are changes to commit
          if git diff --quiet extensions.json; then
            echo "No changes to extensions.json"
          else
            echo "Committing changes to extensions.json"
            git add extensions.json
            git commit -m "Update splitpayments extension to $VERSION (created by Cursor-MCP-MAF)"
            git push https://${{ secrets.EXTENSIONS_REPO_TOKEN }}@github.com/MichaelAntonFischer/lnbits-extensions.git main
            echo "Successfully updated extensions.json with version $VERSION"
          fi
        env:
          EXTENSIONS_REPO_TOKEN: ${{ secrets.EXTENSIONS_REPO_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
          IS_RC: ${{ steps.get_version.outputs.is_rc }}
          CLEAN_VERSION: ${{ steps.get_version.outputs.clean_version }}
          HASH: ${{ steps.calculate_hash.outputs.hash }}

